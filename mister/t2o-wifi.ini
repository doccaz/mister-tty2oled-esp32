# Settings for the WiFi display daemon (t2o-wifi). It also reads the stock
# tty2oled-system.ini / tty2oled-user.ini (TRANSITION, USE_*_PICTURE, USE_RANDOM_ALT,
# and - if WIFI_SEND_SETTINGS="yes" - CONTRAST, ROTATE, SCREENSAVER*).

# The display's address: a ".local" name (resolved by the daemon's own mDNS resolver, e.g.
# "tty2oled-B610.local", shown on the display's Connected screen) or a plain IP.
HOST="tty2oled-XXXX.local"

# "no" (default): don't send contrast/rotation/screensaver, so the display keeps the
# values from its own settings page (http://<display>/settings).
# "yes": send them from the stock ini like the original tty2oled.sh does.
WIFI_SEND_SETTINGS="no"
