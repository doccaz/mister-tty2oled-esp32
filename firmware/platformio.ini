; tty2oled-gc9a01 firmware
; ESP32-C3-mini + GC9A01 240x240 round SPI display
; Protocol superset of venice1200/MiSTer_tty2oled (see ../reference and ../CLAUDE.md)
;
; Two build variants, since the same ESP32-C3-mini board is sold both with
; and without the built-in 0.42" SSD1306 status OLED (see CLAUDE.md
; "Onboard status OLED"):
;   pio run -e esp32c3                 default, includes the onboard OLED
;   pio run -e esp32c3_nooled          same firmware, OLED support compiled out
;   pio run -e esp32c3_2424s012        Sunton ESP32-2424S012C all-in-one round board
; GC9A01 pin assignments (pins.h) are identical in both - only the OLED
; status display and its U8g2/Wire dependency are affected.

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Native USB-Serial/JTAG on the C3 (fixed to GPIO18/19 in hardware) instead of a UART bridge.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Default Arduino loop-task stack is 8KB, too little for JPEGDEC's
    ; decode (DCT/Huffman use meaningful stack depth) - found by testing
    ; against real hardware: JPEGDEC calls corrupted memory badly enough
    ; to make the *next* incoming serial command misparse, even though
    ; the actual bug was a stack overflow during decode, not anything in
    ; the serial/protocol code being changed at the time.
    -DARDUINO_LOOP_STACK_SIZE=32768

; No graphics-library dependency for the panel driver itself: both
; moononournation/GFX Library for Arduino and TFT_eSPI turned out to have
; real ESP32-C3 compatibility bugs (see CLAUDE.md "Why a custom GC9A01
; driver"). display.cpp talks to the panel directly over Arduino's plain
; SPIClass (proven working on this hardware) and uses Adafruit GFX Library
; only for text/shape primitives (pure software drawing, no display-specific
; driver code, so no C3-specific hardware access to break).
; ricmoo/QRCode: small pure-C QR encoder, no dynamic allocation (caller
; supplies a fixed-size buffer sized by qrcode_getBufferSize()) - used for
; the WiFi-join QR shown on the GC9A01 in AP mode (see display.cpp's
; drawWifiQrScreen(), wifi_manager.h). WiFi.h/WebServer.h/DNSServer.h/
; ESPmDNS.h are bundled with the arduino-esp32 core itself (like SPI/Wire
; already were) so they don't need lib_deps entries.
; links2004/WebSockets: WS server for the WiFi command protocol (see
; ws_protocol.h/.cpp, CLAUDE.md's "Wire protocol over WiFi") - each binary
; frame is capped small (2048 bytes) by the protocol design itself, so the
; library never needs a large contiguous heap allocation to reassemble a
; frame, which the measured ~13.3KB largest-allocatable-block budget
; couldn't otherwise guarantee for a whole JPEG at once.
; links2004/WebSockets unconditionally #includes <WiFiClientSecure.h> for
; the ESP32 target even though we never use wss:// - and PlatformIO's LDF
; does not auto-discover that specific framework-bundled library (unlike
; WiFi/Wire/DNSServer/etc, which resolve fine with no lib_deps entry at
; all) on this framework-arduinoespressif32 version, from any including
; file, project or library. lib_extra_dirs points LDF straight at its
; parent folder so it's found the same way third-party lib_deps entries
; are, sidestepping whatever the framework-library auto-discovery gap is.
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif32/libraries
lib_deps =
    bitbank2/JPEGDEC @ ^1.8.2
    adafruit/Adafruit GFX Library @ ^1.12.6
    ricmoo/QRCode @ ^0.0.1
    links2004/WebSockets @ ^2.4.0
    ; MQTT notifications (mqtt_client.h/.cpp) - plain WiFiClient, no TLS,
    ; so unlike WebSockets this shouldn't need the lib_extra_dirs
    ; workaround above (no WiFiClientSecure.h dependency to trip over).
    knolleary/PubSubClient @ ^2.8

[env:esp32c3]
build_flags =
    ${env.build_flags}
    -DHAS_ONBOARD_OLED=1
lib_deps =
    ${env.lib_deps}
    olikraus/U8g2 @ ^2.35.19

[env:esp32c3_nooled]
build_flags =
    ${env.build_flags}
    -DHAS_ONBOARD_OLED=0
; Wire is NOT excluded here even though this build has no OLED code
; enabled: Adafruit GFX Library's BusIO dependency (Adafruit_I2CDevice.h,
; included from Adafruit_GFX.h) hard-requires Wire.h to compile at all,
; independent of anything in oled_status.cpp - lib_ignore = Wire breaks
; the build. U8g2 itself is genuinely excluded, simply by not being
; listed in this env's lib_deps (unlike Wire, it's not a bundled core
; library LDF would auto-resolve regardless).

; Sunton ESP32-2424S012C: GC9A01 soldered to fixed pins (see pins.h), no
; reset GPIO, no status OLED.
[env:esp32c3_2424s012]
build_flags =
    ${env.build_flags}
    -DHAS_ONBOARD_OLED=0
    -DBOARD_2424S012=1
