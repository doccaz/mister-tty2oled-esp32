#
# Builds the firmware (all three board variants) and the web app, then
# publishes the web flasher + marquee app to GitHub Pages. Runs on every
# version tag, or by hand from the Actions tab.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        working-directory: firmware
        run: |
          pio run -e esp32c3
          pio run -e esp32c3_nooled
          pio run -e esp32c3_2424s012

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Assemble site
        run: tools/build_site.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
