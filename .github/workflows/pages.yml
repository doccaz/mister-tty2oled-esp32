#
# Publishes the web flasher + marquee web app to GitHub Pages.
#
# The firmware images are NOT built here: they're the merged .bin files
# attached to a GitHub release (built and hardware-tested locally), so the
# flasher always ships exactly the binaries that were verified. A clean
# `pio run` resolves to a different (official, consistent) Arduino toolchain
# than the tested local one - see CLAUDE.md "Web flasher + GitHub Pages".
#
# Run it by hand (Actions -> Pages -> Run workflow, optionally naming a tag;
# default is the latest release) - tools/release.sh dispatches it after
# publishing. Deliberately NOT triggered by the `release` event: that run
# executes on the tag ref, and the github-pages environment only allows
# deploys from main, so it was rejected ("Tag v0.4.2 is not allowed to deploy
# to github-pages"). A workflow_dispatch run executes on main.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Pages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose firmware to publish (default: latest release)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Always the tooling from main, even when triggered by an older tag.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Download release firmware
        id: fw
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --json tagName -q .tagName)"
          fi
          echo "Publishing firmware from release $TAG"
          mkdir -p fw
          # Firmware images plus the MiSTer daemon assets (build_site.sh needs both: the
          # flasher parts and the four files the Downloader database points at).
          gh release download "$TAG" --dir fw \
            --pattern '*.bin' \
            --pattern 't2o-wifi' --pattern 'S60t2o-wifi' \
            --pattern 't2o-wifi.ini' --pattern 't2o_wifi.sh'
          ls -l fw
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The public-domain art pack lives in its own release (art-pd-N, never "latest", so the
      # firmware release above stays what `gh release view` returns). Optional: with no pack
      # release yet, the art database is just not published. When one exists its assets must
      # all download, or build_site.sh (build_art_db.py) fails the deploy.
      - name: Download art pack release
        id: art
        run: |
          ART_TAG="$(gh release list --limit 200 --json tagName -q '.[].tagName' | grep -E '^art-pd-[0-9]+$' | sort -V | tail -1 || true)"
          if [ -n "$ART_TAG" ]; then
            echo "Publishing art database from release $ART_TAG"
            mkdir -p art
            gh release download "$ART_TAG" --dir art --pattern 'art-pd_*'
            ls art | wc -l
            echo "tag=$ART_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "No art-pd-N release yet; skipping the art database"
          fi

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Assemble site
        env:
          FIRMWARE_DIR: ${{ github.workspace }}/fw
          FIRMWARE_VERSION: ${{ steps.fw.outputs.version }}
          ART_DIR: ${{ steps.art.outputs.tag && format('{0}/art', github.workspace) || '' }}
          ART_TAG: ${{ steps.art.outputs.tag }}
        run: tools/build_site.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
